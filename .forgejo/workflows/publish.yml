name: Build and Publish Package

on:
  push:
    paths:
      - "pacman/PKGBUILD"
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: codeberg-small
    container:
      image: archlinux:base

    steps:
      - name: Prepare pacman environment
        run: |
          # Initialise the keyring FIRST so the signing key exists before
          # pacman tries to use it when reinstalling archlinux-keyring.
          pacman-key --init
          pacman-key --populate

          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel git jq wget curl nodejs

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read package metadata
        id: pkgmeta
        run: |
          PKGNAME=$(grep -oP '^pkgname=\K.*' pacman/PKGBUILD)
          PKGVER=$(grep -oP '^pkgver=\K.*'   pacman/PKGBUILD)
          PKGREL=$(grep -oP '^pkgrel=\K.*'   pacman/PKGBUILD)

          echo "pkgname=$PKGNAME" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER"   >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL"   >> "$GITHUB_OUTPUT"

          echo "Package: $PKGNAME"
          echo "Version: $PKGVER-$PKGREL"

      - name: Create builder user
        run: |
          # makepkg refuses to run as root; create a dedicated builder user.
          id builder &>/dev/null || useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          runuser -u builder -- \
            makepkg \
              --noconfirm \
              --skippgpcheck

      - name: Locate built package
        id: locate
        run: |
          PKGFILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -name "*.pkg.tar.zst" \
            ! -name "*-debug-*" \
            | head -n 1)

          if [ -z "$PKGFILE" ]; then
            echo "ERROR: No .pkg.tar.zst found" >&2
            exit 1
          fi

          echo "pkgfile=$PKGFILE"                   >> "$GITHUB_OUTPUT"
          echo "pkgbasename=$(basename "$PKGFILE")" >> "$GITHUB_OUTPUT"
          echo "Found: $PKGFILE"

      - name: Upload package to Codeberg Package Registry
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_OWNER: ${{ vars.CODEBERG_OWNER }}
        run: |
          PKGFILE="${{ steps.locate.outputs.pkgfile }}"

          echo "Uploading: $(basename "$PKGFILE")"

          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            -X PUT \
            "https://codeberg.org/api/packages/${CODEBERG_OWNER}/arch/os" \
            --user "${CODEBERG_OWNER}:${CODEBERG_TOKEN}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@${PKGFILE}")

          echo "HTTP status: $HTTP_STATUS"

          # 201 Created or 200 OK are both acceptable.
          if [ "$HTTP_STATUS" -ne 201 ] && [ "$HTTP_STATUS" -ne 200 ]; then
            echo "ERROR: Upload failed with HTTP $HTTP_STATUS" >&2
            exit 1
          fi

          echo "Successfully published $(basename "$PKGFILE") to Codeberg Packages."
